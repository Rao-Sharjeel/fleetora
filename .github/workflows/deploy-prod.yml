name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  check-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fleetora_ci
          POSTGRES_USER: fleetora_ci
          POSTGRES_PASSWORD: fleetora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r backend/requirements/prod.txt

      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: fleetora.settings.dev
          DJANGO_SECRET_KEY: ci-check-only
          DB_NAME: fleetora_ci
          DB_HOST: localhost
          DB_USER: fleetora_ci
          DB_PASSWORD: fleetora_ci
          DB_PORT: '5432'

  deploy:
    runs-on: ubuntu-latest
    needs: check-migrations

    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /srv/fleetora-production
            git pull origin main
            docker compose -p fleetora-production -f docker-compose.prod.yml up -d --build
            docker image prune -f
