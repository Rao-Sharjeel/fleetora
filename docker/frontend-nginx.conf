# Caddy terminates TLS and reverse-proxies all five hostnames here on one
# port, preserving the original Host header — these server_name blocks are
# what actually separate the five apps from a single container/port.

server {
    listen 80;
    server_name drive.dynamic-sourcing.com;
    root /usr/share/nginx/html/admin;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name entry.drive.dynamic-sourcing.com;
    root /usr/share/nginx/html/entry;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# The merged gate app: one install, one pairing, one copy of the 15 MB
# odometer OCR model, and a launcher that offers whichever of Exit/Entry/Fuel
# the device's key allows. Served on the Exit hostname so the phones already
# paired there keep their stored key — same origin, same localStorage.
# entry./fuel. still serve the standalone builds until those are retired.
server {
    listen 80;
    server_name exit.drive.dynamic-sourcing.com;
    root /usr/share/nginx/html/kiosk;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name fuel.drive.dynamic-sourcing.com;
    root /usr/share/nginx/html/fuel;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name platform.drive.dynamic-sourcing.com;
    root /usr/share/nginx/html/platform;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
