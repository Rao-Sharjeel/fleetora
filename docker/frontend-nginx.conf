# Caddy terminates TLS and reverse-proxies all five hostnames here on one
# port, preserving the original Host header — these server_name blocks are
# what actually separate the five apps from a single container/port.

server {
    listen 80;
    server_name drive.dynamic-sourcing.com;
    root /usr/share/nginx/html/admin;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

